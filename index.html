<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มีอะไรจะบอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff6ee;
    --paper-deep: #ffe6d8;
    --ink: #4a2530;
    --ink-soft: #8a5f68;
    --rose: #e0455f;
    --rose-deep: #b92f49;
    --blush: #ffc2cc;
    --card: #ffffff;
    --line: #f3d3cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Sarabun", "Thonburi", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffd9d2 0, transparent 45%),
      radial-gradient(circle at 90% 90%, #ffd0dc 0, transparent 40%),
      var(--paper);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, .line, .btn { font-family: "Mali", "Thonburi", cursive; }

  /* หัวใจลอยพื้นหลัง */
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .float {
    position: absolute; bottom: -40px;
    color: var(--blush); opacity: .7;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
  }

  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex;
    padding: 24px 16px;
  }

  .scene {
    display: none;
    width: min(100%, 420px);
    margin: auto;
    text-align: center;
    animation: enter .5s cubic-bezier(.2, .8, .2, 1);
  }
  .scene.on { display: block; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(18px) scale(.97); }
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 18px 40px -22px rgba(185, 47, 73, .45);
  }

  h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); line-height: 1.35; font-weight: 700; }
  h2 { font-size: clamp(1.4rem, 6vw, 1.75rem); line-height: 1.4; font-weight: 700; }
  p.sub { color: var(--ink-soft); margin-top: 10px; font-size: 1.02rem; line-height: 1.6; }
  .name { color: var(--rose); }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-size: 1.1rem; font-weight: 600;
    padding: 13px 28px; border-radius: 999px;
    background: var(--rose); color: #fff;
    box-shadow: 0 6px 0 var(--rose-deep);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rose-deep); }
  .btn.ghost {
    background: #fff; color: var(--ink-soft);
    border: 1.5px solid var(--line);
    box-shadow: 0 4px 0 var(--line);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .envelope:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 3px;
  }

  /* น้องแมว */
  .cat { display: block; width: 104px; margin: 0 auto; line-height: 0; }
  .cat svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cat .ear-l, .cat .ear-r { transform-box: fill-box; transform-origin: 50% 100%; }
  .cat .ear-l { animation: twitch 4s ease-in-out infinite; }
  .cat .ear-r { animation: twitch 4s ease-in-out .25s infinite; }
  @keyframes twitch { 92% { transform: rotate(0); } 95% { transform: rotate(-9deg); } 98% { transform: rotate(4deg); } }
  .cat.wiggle { animation: wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 50% { transform: rotate(4deg) translateY(-3px); } }
  /* รูปแมวจริง ใส่กรอบแบบโพลารอยด์ */
  .polaroid {
    position: relative;
    background: #fff;
    padding: 8px 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    box-shadow: 0 10px 22px -14px rgba(74, 37, 48, .55);
    transform: rotate(var(--tilt, 0deg));
  }
  .polaroid img {
    display: block; width: 100%;
    aspect-ratio: 1; object-fit: cover;
    border-radius: 3px;
    background: var(--paper-deep);
  }
  .polaroid figcaption {
    font-family: "Mali", "Thonburi", cursive;
    font-size: .92rem; font-weight: 600;
    color: var(--rose-deep);
    margin-top: 7px; line-height: 1.3;
  }
  .polaroid.pop { animation: pop .45s cubic-bezier(.3, 1.5, .5, 1) backwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.7) rotate(0deg); } }

  /* ฉาก 1: ซองจดหมาย */
  .envelope {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: block; margin: -14px auto 26px;
    width: 190px; height: 130px; position: relative;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .envelope .body {
    position: absolute; inset: 0;
    background: var(--paper-deep);
    border: 2px solid var(--rose);
    border-radius: 12px;
    overflow: hidden;
  }
  .envelope .body::before, .envelope .body::after {
    content: ""; position: absolute; bottom: 0; width: 72%; height: 2px;
    background: var(--rose); opacity: .5;
  }
  .envelope .body::before { left: -8%; transform-origin: left bottom; transform: rotate(-32deg); }
  .envelope .body::after { right: -8%; transform-origin: right bottom; transform: rotate(32deg); }
  .envelope .flap {
    position: absolute; top: 0; left: 0; right: 0; height: 0;
    border-left: 95px solid transparent;
    border-right: 95px solid transparent;
    border-top: 72px solid var(--blush);
    transform-origin: top; transition: transform .5s;
    filter: drop-shadow(0 2px 0 var(--rose));
  }
  .envelope .seal {
    position: absolute; left: 50%; top: 50px;
    transform: translateX(-50%);
    font-size: 30px; color: var(--rose);
    transition: opacity .3s;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope.open .seal { opacity: 0; }

  /* ฉาก 2: มุก */
  .line {
    font-size: clamp(1.3rem, 5.6vw, 1.6rem);
    line-height: 1.6; font-weight: 600;
    min-height: 4.8em;
    display: grid; place-items: center;
  }
  .line span { animation: enter .45s cubic-bezier(.2, .8, .2, 1); }
  .dots { display: flex; gap: 7px; justify-content: center; margin: 14px 0 22px; }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line); transition: all .3s;
  }
  .dots i.on { background: var(--rose); width: 22px; border-radius: 8px; }

  .card .polaroid { width: min(78%, 250px); margin: 0 auto 18px; }

  /* ฉาก 3: กำแพงแมว */
  #s3 { width: min(100%, 560px); padding-bottom: 24px; }
  .wall {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 16px 14px; margin: 24px 0 26px;
  }
  @media (min-width: 520px) { .wall { grid-template-columns: repeat(3, 1fr); } }
  .float.word { font-family: "Mali", "Thonburi", cursive; font-weight: 600; color: #f3a5b3; white-space: nowrap; }

  .burst {
    position: fixed; z-index: 9; pointer-events: none;
    animation: fly .95s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  @keyframes fly {
    to { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>

<main>
  <!-- 1 -->
  <section class="scene on" id="s1">
    <div class="cat wiggle" data-mood="normal" data-fur="orange"></div>
    <button class="envelope" id="envelope" aria-label="เปิดจดหมาย">
      <span class="body"></span>
      <span class="flap"></span>
      <span class="seal">♥</span>
    </button>
    <h1>มีจดหมายถึง <span class="name" data-her></span></h1>
    <p class="sub">แตะที่ซองเพื่อเปิดอ่านนะ</p>
  </section>

  <!-- 2 -->
  <section class="scene" id="s2">
    <div class="card">
      <figure class="polaroid" id="linePhoto">
        <img id="lineImg" alt="รูปแมว">
        <figcaption id="lineCheer"></figcaption>
      </figure>
      <div class="line" id="line" aria-live="polite"></div>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next">ต่อไป</button>
    </div>
  </section>

  <!-- 3 -->
  <section class="scene" id="s3">
    <h1>สู้ ๆ นะ <span class="name" data-her></span></h1>
    <p class="sub">แมวทุกตัวในนี้มาเป็นกำลังใจให้</p>
    <div class="wall" id="wall"></div>
    <button class="btn" id="more">ขอแมวเพิ่มอีก</button>
  </section>
</main>

<script>
  // ====== แก้ตรงนี้ได้เลย ======
  const HER_NAME = "เธอ";      // ชื่อเธอ เช่น "มิ้นท์" (เว้นว่าง = ใช้คำว่า "เธอ")

  const LINES = [
    "เธอเหนื่อยไหม...    วันนี้เธอเก่งมากๆเลยคับ",
    "กินข้าวด้วยนะ ดื่มน้ำบ่อยๆนะคับช่วงนี้อากาศมันร้อน",
    "สองนิ้วนะคับ อย่าหักโหมงานมากนักนะ",
    "ยิ้มเยอะๆนะคับ โลกจะได้สดใสเพราะตอนเธอยิ้มโลกดูน่าอยู่ขึ้นมาเลย",
    "อะไรที่เจอแย่ๆในวันนี้ก็พยายามปล่อยมันไปนะคับ เธอทำเต็มที่แล้วเธอเก่งมากๆแล้ว"
  ];

  // ข้อความเล็ก ๆ ใต้รูปแมว (สุ่มหยิบไปใช้)
  const CHEERS = ["สู้ ๆ นะ", "สู้ ๆ น้า", "สู้ ๆ นะคนเก่ง", "สู้ ๆ นะ", "เก่งมากแล้ว", "สู้ ๆ เมี๊ยว", "เป็นกำลังใจให้นะ", "สู้ ๆ นะ"];
  const CATS_PER_LOAD = 12;   // จำนวนรูปแมวต่อการกด 1 ครั้ง
  // ==============================

  const her = HER_NAME.trim() || "เธอ";
  const $ = id => document.getElementById(id);
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.querySelectorAll("[data-her]").forEach(el => el.textContent = her);
  document.title = "มีอะไรจะบอก" + (HER_NAME.trim() ? " " + her : "");

  // วาดน้องแมว: mood = normal | happy | love | sad, fur = orange | cream | gray
  const FURS = {
    orange: ["#ffb766", "#e8934a"],
    cream:  ["#ffe2b8", "#eebd82"],
    gray:   ["#d3cdd9", "#a9a1b3"]
  };
  const heartEye = (x, y) =>
    `<path d="M${x} ${y + 7}C${x - 13} ${y - 3} ${x - 5} ${y - 11} ${x} ${y - 3}C${x + 5} ${y - 11} ${x + 13} ${y - 3} ${x} ${y + 7}Z" fill="#e0455f"/>`;
  const roundEye = x =>
    `<circle cx="${x}" cy="60" r="6.5" fill="#4a2530"/><circle cx="${x + 2}" cy="57.5" r="2.2" fill="#fff"/>`;
  function catSVG(mood = "normal", fur = "orange") {
    const [f, d] = FURS[fur] || FURS.orange;
    const ink = "#4a2530";
    const eyes = {
      normal: roundEye(42) + roundEye(78),
      happy: `<path d="M35 62q7-10 14 0M71 62q7-10 14 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`,
      love: heartEye(42, 59) + heartEye(78, 59),
      sad: roundEye(42) + roundEye(78) +
        `<path d="M34 51l13-5M86 51l-13-5" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>` +
        `<path d="M38 69q-5 8 0 10q5-2 0-10" fill="#7cc4f0"/>`
    }[mood];
    const mouth = mood === "sad"
      ? `<path d="M52 82q8-7 16 0" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`
      : `<path d="M60 75q-5 7-10 2M60 75q5 7 10 2" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 120 112" aria-hidden="true">
      <g class="ear-l"><path d="M20 46L25 7L55 31Z" fill="${f}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M29 37L31 18L46 30Z" fill="#ffc2cc"/></g>
      <g class="ear-r"><path d="M100 46L95 7L65 31Z" fill="${f}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M91 37L89 18L74 30Z" fill="#ffc2cc"/></g>
      <ellipse cx="60" cy="62" rx="46" ry="38" fill="${f}" stroke="${d}" stroke-width="2"/>
      <path d="M60 26v10M49 28v7M71 28v7" stroke="${d}" stroke-width="4" stroke-linecap="round"/>
      <circle cx="29" cy="75" r="7" fill="#ff9fb0" opacity=".55"/><circle cx="91" cy="75" r="7" fill="#ff9fb0" opacity=".55"/>
      ${eyes}
      <path d="M56 69h8l-4 5z" fill="#e0455f" stroke="#e0455f" stroke-width="1.5" stroke-linejoin="round"/>
      ${mouth}
      <path d="M12 66l17 3M12 77l17-1M108 66l-17 3M108 77l-17-1" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
      <ellipse cx="42" cy="101" rx="11" ry="8" fill="${f}" stroke="${d}" stroke-width="2"/><ellipse cx="78" cy="101" rx="11" ry="8" fill="${f}" stroke="${d}" stroke-width="2"/>
    </svg>`;
  }
  function setCat(el, mood, fur) {
    if (mood) el.dataset.mood = mood;
    if (fur) el.dataset.fur = fur;
    el.innerHTML = catSVG(el.dataset.mood, el.dataset.fur);
  }
  document.querySelectorAll(".cat[data-mood]").forEach(el => setCat(el));

  function go(n) {
    document.querySelectorAll(".scene").forEach(s => s.classList.remove("on"));
    $("s" + n).classList.add("on");
  }

  // หัวใจลอยพื้นหลัง
  if (!calm) {
    const sky = $("sky");
    setInterval(() => {
      const h = document.createElement("span");
      h.className = "float";
      const roll = Math.random();
      h.textContent = roll < .2 ? "🐾" : roll < .45 ? "สู้ ๆ นะ" : "♥";
      if (roll >= .2 && roll < .45) h.classList.add("word");
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = (h.classList.contains("word") ? 12 + Math.random() * 6 : 12 + Math.random() * 22) + "px";
      h.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      h.style.setProperty("--spin", (Math.random() * 80 - 40) + "deg");
      h.style.animationDuration = 7 + Math.random() * 6 + "s";
      sky.appendChild(h);
      h.addEventListener("animationend", () => h.remove());
    }, 650);
  }

  function burst(x, y, count = 26) {
    if (calm) return;
    const bits = ["♥", "♥", "♥", "✿", "✦"];
    const colors = ["#e0455f", "#ff8fa3", "#ffb347", "#b92f49"];
    for (let i = 0; i < count; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = bits[i % bits.length];
      b.style.left = x + "px";
      b.style.top = y + "px";
      b.style.color = colors[i % colors.length];
      b.style.fontSize = 14 + Math.random() * 20 + "px";
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 190;
      b.style.setProperty("--x", Math.cos(a) * d + "px");
      b.style.setProperty("--y", Math.sin(a) * d - 60 + "px");
      b.style.setProperty("--r", (Math.random() * 360 - 180) + "deg");
      document.body.appendChild(b);
      b.addEventListener("animationend", () => b.remove());
    }
  }

  // รูปแมวจริง: ดึงจาก TheCatAPI ถ้าดึงไม่ได้ใช้ cataas.com แทน
  const pool = [];
  let loading = null;
  const backupCat = () => `https://cataas.com/cat?width=500&height=500&r=${Math.random()}`;
  function refill() {
    loading ??= fetch("https://api.thecatapi.com/v1/images/search?limit=10&mime_types=jpg,png&size=med")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(list => pool.push(...list.map(c => c.url)))
      .catch(() => { for (let i = 0; i < 10; i++) pool.push(backupCat()); })
      .finally(() => { loading = null; });
    return loading;
  }
  async function nextCat() {
    if (!pool.length) await refill();
    if (pool.length < 4) refill();
    return pool.shift();
  }
  function showCat(img, url) {
    img.onerror = () => { img.onerror = () => img.closest(".polaroid").remove(); img.src = backupCat(); };
    img.src = url;
  }
  const cheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];
  refill();

  // ฉาก 1
  $("envelope").addEventListener("click", e => {
    e.currentTarget.classList.add("open");
    setTimeout(() => { go(2); showLine(); }, calm ? 0 : 600);
  });

  // ฉาก 2
  let idx = 0;
  function showLine() {
    const span = document.createElement("span");
    span.textContent = LINES[idx].replaceAll("เธอ", her);
    $("line").replaceChildren(span);
    $("linePhoto").style.setProperty("--tilt", (idx % 2 ? 2.5 : -2.5) + "deg");
    $("lineCheer").textContent = cheer();
    const shown = idx;
    nextCat().then(url => { if (shown === idx) showCat($("lineImg"), url); });
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === idx));
    $("next").textContent = idx === LINES.length - 1 ? "ไปดูแมวกัน" : "ต่อไป";
  }
  $("next").addEventListener("click", () => {
    if (++idx < LINES.length) { showLine(); return; }
    go(3);
    scrollTo(0, 0);
    burst(innerWidth / 2, innerHeight / 3, 34);
    addCats();
  });

  // ฉาก 3: กำแพงแมว
  async function addCats() {
    $("more").disabled = true;
    for (let i = 0; i < CATS_PER_LOAD; i++) {
      const fig = document.createElement("figure");
      fig.className = "polaroid pop";
      fig.style.setProperty("--tilt", (Math.random() * 7 - 3.5).toFixed(1) + "deg");
      fig.style.animationDelay = i * 60 + "ms";
      const img = document.createElement("img");
      img.alt = "รูปแมว";
      img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = cheer();
      fig.append(img, cap);
      $("wall").appendChild(fig);
      showCat(img, await nextCat());
    }
    $("more").disabled = false;
  }
  $("more").addEventListener("click", addCats);
</script>
</body>
</html>
