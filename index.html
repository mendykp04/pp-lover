<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มีอะไรจะบอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff6ee;
    --paper-deep: #ffe6d8;
    --ink: #4a2530;
    --ink-soft: #8a5f68;
    --rose: #e0455f;
    --rose-deep: #b92f49;
    --blush: #ffc2cc;
    --card: #ffffff;
    --line: #f3d3cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Sarabun", "Thonburi", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffd9d2 0, transparent 45%),
      radial-gradient(circle at 90% 90%, #ffd0dc 0, transparent 40%),
      var(--paper);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, .line, .btn, .chip, .stamp { font-family: "Mali", "Thonburi", cursive; }

  /* หัวใจลอยพื้นหลัง */
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .float {
    position: absolute; bottom: -40px;
    color: var(--blush); opacity: .7;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
  }

  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex;
    padding: 24px 16px;
  }

  .scene {
    display: none;
    width: min(100%, 420px);
    margin: auto;
    text-align: center;
    animation: enter .5s cubic-bezier(.2, .8, .2, 1);
  }
  .scene.on { display: block; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(18px) scale(.97); }
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 18px 40px -22px rgba(185, 47, 73, .45);
  }

  h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); line-height: 1.35; font-weight: 700; }
  h2 { font-size: clamp(1.4rem, 6vw, 1.75rem); line-height: 1.4; font-weight: 700; }
  p.sub { color: var(--ink-soft); margin-top: 10px; font-size: 1.02rem; line-height: 1.6; }
  .name { color: var(--rose); }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-size: 1.1rem; font-weight: 600;
    padding: 13px 28px; border-radius: 999px;
    background: var(--rose); color: #fff;
    box-shadow: 0 6px 0 var(--rose-deep);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rose-deep); }
  .btn.ghost {
    background: #fff; color: var(--ink-soft);
    border: 1.5px solid var(--line);
    box-shadow: 0 4px 0 var(--line);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .chip:focus-visible, .envelope:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 3px;
  }

  /* น้องแมว */
  .cat { display: block; width: 104px; margin: 0 auto; line-height: 0; }
  .cat svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cat .ear-l, .cat .ear-r { transform-box: fill-box; transform-origin: 50% 100%; }
  .cat .ear-l { animation: twitch 4s ease-in-out infinite; }
  .cat .ear-r { animation: twitch 4s ease-in-out .25s infinite; }
  @keyframes twitch { 92% { transform: rotate(0); } 95% { transform: rotate(-9deg); } 98% { transform: rotate(4deg); } }
  .cat.wiggle { animation: wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 50% { transform: rotate(4deg) translateY(-3px); } }
  .card.has-cat, .ticket.has-cat { position: relative; margin-top: 74px; }
  .cat.peek {
    position: absolute; left: 50%; top: -82px;
    transform: translateX(-50%);
  }
  .pair {
    position: absolute; left: 0; right: 0; top: -78px;
    display: flex; justify-content: center; align-items: flex-end; gap: 4px;
  }
  .pair .cat { width: 92px; margin: 0; }
  .pair .cat:first-child { transform: rotate(-6deg); }
  .pair .cat:last-child { transform: rotate(6deg); }
  .pair .heart { color: var(--rose); font-size: 26px; line-height: 1; margin-bottom: 34px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }

  /* ฉาก 1: ซองจดหมาย */
  .envelope {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: block; margin: -14px auto 26px;
    width: 190px; height: 130px; position: relative;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .envelope .body {
    position: absolute; inset: 0;
    background: var(--paper-deep);
    border: 2px solid var(--rose);
    border-radius: 12px;
    overflow: hidden;
  }
  .envelope .body::before, .envelope .body::after {
    content: ""; position: absolute; bottom: 0; width: 72%; height: 2px;
    background: var(--rose); opacity: .5;
  }
  .envelope .body::before { left: -8%; transform-origin: left bottom; transform: rotate(-32deg); }
  .envelope .body::after { right: -8%; transform-origin: right bottom; transform: rotate(32deg); }
  .envelope .flap {
    position: absolute; top: 0; left: 0; right: 0; height: 0;
    border-left: 95px solid transparent;
    border-right: 95px solid transparent;
    border-top: 72px solid var(--blush);
    transform-origin: top; transition: transform .5s;
    filter: drop-shadow(0 2px 0 var(--rose));
  }
  .envelope .seal {
    position: absolute; left: 50%; top: 50px;
    transform: translateX(-50%);
    font-size: 30px; color: var(--rose);
    transition: opacity .3s;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope.open .seal { opacity: 0; }

  /* ฉาก 2: มุก */
  .line {
    font-size: clamp(1.3rem, 5.6vw, 1.6rem);
    line-height: 1.6; font-weight: 600;
    min-height: 5.2em;
    display: grid; place-items: center;
  }
  .line span { animation: enter .45s cubic-bezier(.2, .8, .2, 1); }
  .dots { display: flex; gap: 7px; justify-content: center; margin: 14px 0 22px; }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line); transition: all .3s;
  }
  .dots i.on { background: var(--rose); width: 22px; border-radius: 8px; }

  /* ฉาก 3: คำถาม */
  .answers {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    margin-top: 28px; min-height: 64px; flex-wrap: wrap;
  }
  #yes { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), box-shadow .12s; }
  #no.running { position: fixed; z-index: 5; transition: left .22s ease-out, top .22s ease-out; }

  /* ฉาก 4: เลือกเดท */
  .group { margin-top: 22px; text-align: left; }
  .group h3 { font-size: .95rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    appearance: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; color: var(--ink);
    padding: 9px 15px; border-radius: 999px;
    background: var(--paper); border: 1.5px solid var(--line);
    transition: all .15s;
  }
  .chip[aria-pressed="true"] {
    background: var(--rose); border-color: var(--rose); color: #fff;
    transform: scale(1.05);
  }

  /* ฉาก 5: ตั๋วเดท */
  .ticket {
    background: var(--card);
    border: 2px dashed var(--rose);
    border-radius: 22px;
    padding: 26px 22px;
    position: relative;
  }
  .ticket dl { margin: 18px 0 6px; text-align: left; }
  .ticket .row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 11px 0; border-bottom: 1.5px dotted var(--line);
  }
  .ticket dt { color: var(--ink-soft); }
  .ticket dd { font-weight: 600; text-align: right; }
  .stamp {
    display: inline-block; margin-top: 16px;
    padding: 5px 14px; border: 2px solid var(--rose); border-radius: 8px;
    color: var(--rose); font-weight: 700; letter-spacing: .04em;
    transform: rotate(-5deg);
  }
  .after { margin-top: 22px; display: grid; gap: 10px; justify-items: center; }
  #copied { font-size: .9rem; color: var(--ink-soft); min-height: 1.3em; }

  .burst {
    position: fixed; z-index: 9; pointer-events: none;
    animation: fly .95s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  @keyframes fly {
    to { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>

<main>
  <!-- 1 -->
  <section class="scene on" id="s1">
    <div class="cat wiggle" data-mood="normal" data-fur="orange"></div>
    <button class="envelope" id="envelope" aria-label="เปิดจดหมาย">
      <span class="body"></span>
      <span class="flap"></span>
      <span class="seal">♥</span>
    </button>
    <h1>มีจดหมายถึง <span class="name" data-her></span></h1>
    <p class="sub">แตะที่ซองเพื่อเปิดอ่านนะ</p>
  </section>

  <!-- 2 -->
  <section class="scene" id="s2">
    <div class="card has-cat">
      <div class="cat peek" id="lineCat"></div>
      <div class="line" id="line" aria-live="polite"></div>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next">ต่อไป</button>
    </div>
  </section>

  <!-- 3 -->
  <section class="scene" id="s3">
    <div class="card has-cat">
      <div class="cat peek" id="askCat" data-mood="love" data-fur="cream"></div>
      <h2>พูดจริง ๆ แล้วนะ<br><span class="name" data-her></span> ไปเดทกับเราไหม?</h2>
      <p class="sub" id="plea">เลือกได้ตามใจเลย ไม่กดดัน (นิดเดียว)</p>
      <div class="answers">
        <button class="btn" id="yes">ไปสิ!</button>
        <button class="btn ghost" id="no">ไม่ดีกว่า</button>
      </div>
    </div>
  </section>

  <!-- 4 -->
  <section class="scene" id="s4">
    <div class="card has-cat">
      <div class="cat peek" data-mood="happy" data-fur="gray"></div>
      <h2>เย้! งั้นเลือกเลย 🎉</h2>
      <p class="sub">อยากไปทำอะไร วันไหนดี</p>
      <div class="group">
        <h3>ไปทำอะไรกันดี</h3>
        <div class="chips" id="what"></div>
      </div>
      <div class="group">
        <h3>วันไหนว่าง</h3>
        <div class="chips" id="when"></div>
      </div>
      <div style="margin-top:28px">
        <button class="btn" id="confirm" disabled>ตกลงตามนี้</button>
      </div>
    </div>
  </section>

  <!-- 5 -->
  <section class="scene" id="s5">
    <div class="ticket has-cat">
      <div class="pair" aria-hidden="true">
        <div class="cat" data-mood="love" data-fur="orange"></div>
        <span class="heart">♥</span>
        <div class="cat" data-mood="happy" data-fur="gray"></div>
      </div>
      <h2>นัดแล้วนะ ห้ามเบี้ยว</h2>
      <dl>
        <div class="row"><dt>คู่เดท</dt><dd id="t-who"></dd></div>
        <div class="row"><dt>กิจกรรม</dt><dd id="t-what"></dd></div>
        <div class="row"><dt>วัน</dt><dd id="t-when"></dd></div>
      </dl>
      <span class="stamp">ยืนยันแล้ว ♥</span>
    </div>
    <div class="after">
      <button class="btn" id="send">ส่งคำตอบกลับ</button>
      <span id="copied" aria-live="polite"></span>
    </div>
  </section>
</main>

<script>
  // ====== แก้ตรงนี้ได้เลย ======
  const HER_NAME = "";      // ชื่อเธอ เช่น "มิ้นท์" (เว้นว่าง = ใช้คำว่า "เธอ")
  const MY_NAME  = "";      // ชื่อเรา (เว้นว่าง = ใช้คำว่า "เรา")

  const LINES = [
    "เธอเหนื่อยไหม...    วันนี้เธอเก่งมากๆเลยคับ",
    "กินข้าวด้วยนะ ดื่มน้ำบ่อยๆนะคับช่วงนี้อากาศมันร้อน",
    "สองนิ้วนะคับ อย่าหักโหมงานมากนักนะ",
    "ยิ้มเยอะๆนะคับ โลกจะได้สดใสเพราะตอนเธอยิ้มโลกดูน่าอยู่ขึ้นมาเลย",
    "อะไรที่เจอแย่ๆในวันนี้ก็พยายามปล่อยมันไปนะคับ เธอทำเต็มที่แล้วเธอเก่งมากๆแล้ว"
  ];

  const ACTIVITIES = ["☕ คาเฟ่", "🍜 กินข้าว", "🎬 ดูหนัง", "🌇 เดินเล่น", "🍦 กินของหวาน"];
  const DAYS = ["เสาร์นี้", "อาทิตย์นี้", "เย็นวันศุกร์", "วันไหนก็ได้"];

  const NO_TEXTS = ["แน่ใจนะ?", "คิดอีกทีสิ", "กดผิดหรือเปล่า", "ใจร้ายจัง 🥺", "ปุ่มนี้เสียแล้ว", "กดอีกปุ่มเถอะนะ"];
  // ==============================

  const her = HER_NAME.trim() || "เธอ";
  const me = MY_NAME.trim() || "เรา";
  const $ = id => document.getElementById(id);
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.querySelectorAll("[data-her]").forEach(el => el.textContent = her);
  document.title = "มีอะไรจะบอก" + (HER_NAME.trim() ? " " + her : "");

  // วาดน้องแมว: mood = normal | happy | love | sad, fur = orange | cream | gray
  const FURS = {
    orange: ["#ffb766", "#e8934a"],
    cream:  ["#ffe2b8", "#eebd82"],
    gray:   ["#d3cdd9", "#a9a1b3"]
  };
  const heartEye = (x, y) =>
    `<path d="M${x} ${y + 7}C${x - 13} ${y - 3} ${x - 5} ${y - 11} ${x} ${y - 3}C${x + 5} ${y - 11} ${x + 13} ${y - 3} ${x} ${y + 7}Z" fill="#e0455f"/>`;
  const roundEye = x =>
    `<circle cx="${x}" cy="60" r="6.5" fill="#4a2530"/><circle cx="${x + 2}" cy="57.5" r="2.2" fill="#fff"/>`;
  function catSVG(mood = "normal", fur = "orange") {
    const [f, d] = FURS[fur] || FURS.orange;
    const ink = "#4a2530";
    const eyes = {
      normal: roundEye(42) + roundEye(78),
      happy: `<path d="M35 62q7-10 14 0M71 62q7-10 14 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`,
      love: heartEye(42, 59) + heartEye(78, 59),
      sad: roundEye(42) + roundEye(78) +
        `<path d="M34 51l13-5M86 51l-13-5" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>` +
        `<path d="M38 69q-5 8 0 10q5-2 0-10" fill="#7cc4f0"/>`
    }[mood];
    const mouth = mood === "sad"
      ? `<path d="M52 82q8-7 16 0" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`
      : `<path d="M60 75q-5 7-10 2M60 75q5 7 10 2" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 120 112" aria-hidden="true">
      <g class="ear-l"><path d="M20 46L25 7L55 31Z" fill="${f}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M29 37L31 18L46 30Z" fill="#ffc2cc"/></g>
      <g class="ear-r"><path d="M100 46L95 7L65 31Z" fill="${f}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M91 37L89 18L74 30Z" fill="#ffc2cc"/></g>
      <ellipse cx="60" cy="62" rx="46" ry="38" fill="${f}" stroke="${d}" stroke-width="2"/>
      <path d="M60 26v10M49 28v7M71 28v7" stroke="${d}" stroke-width="4" stroke-linecap="round"/>
      <circle cx="29" cy="75" r="7" fill="#ff9fb0" opacity=".55"/><circle cx="91" cy="75" r="7" fill="#ff9fb0" opacity=".55"/>
      ${eyes}
      <path d="M56 69h8l-4 5z" fill="#e0455f" stroke="#e0455f" stroke-width="1.5" stroke-linejoin="round"/>
      ${mouth}
      <path d="M12 66l17 3M12 77l17-1M108 66l-17 3M108 77l-17-1" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
      <ellipse cx="42" cy="101" rx="11" ry="8" fill="${f}" stroke="${d}" stroke-width="2"/><ellipse cx="78" cy="101" rx="11" ry="8" fill="${f}" stroke="${d}" stroke-width="2"/>
    </svg>`;
  }
  function setCat(el, mood, fur) {
    if (mood) el.dataset.mood = mood;
    if (fur) el.dataset.fur = fur;
    el.innerHTML = catSVG(el.dataset.mood, el.dataset.fur);
  }
  document.querySelectorAll(".cat[data-mood]").forEach(el => setCat(el));

  function go(n) {
    document.querySelectorAll(".scene").forEach(s => s.classList.remove("on"));
    $("s" + n).classList.add("on");
  }

  // หัวใจลอยพื้นหลัง
  if (!calm) {
    const sky = $("sky");
    setInterval(() => {
      const h = document.createElement("span");
      h.className = "float";
      h.textContent = Math.random() < .25 ? "🐾" : "♥";
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = 12 + Math.random() * 22 + "px";
      h.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      h.style.setProperty("--spin", (Math.random() * 80 - 40) + "deg");
      h.style.animationDuration = 7 + Math.random() * 6 + "s";
      sky.appendChild(h);
      h.addEventListener("animationend", () => h.remove());
    }, 650);
  }

  function burst(x, y, count = 26) {
    if (calm) return;
    const bits = ["♥", "♥", "♥", "✿", "✦"];
    const colors = ["#e0455f", "#ff8fa3", "#ffb347", "#b92f49"];
    for (let i = 0; i < count; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = bits[i % bits.length];
      b.style.left = x + "px";
      b.style.top = y + "px";
      b.style.color = colors[i % colors.length];
      b.style.fontSize = 14 + Math.random() * 20 + "px";
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 190;
      b.style.setProperty("--x", Math.cos(a) * d + "px");
      b.style.setProperty("--y", Math.sin(a) * d - 60 + "px");
      b.style.setProperty("--r", (Math.random() * 360 - 180) + "deg");
      document.body.appendChild(b);
      b.addEventListener("animationend", () => b.remove());
    }
  }

  // ฉาก 1
  $("envelope").addEventListener("click", e => {
    e.currentTarget.classList.add("open");
    setTimeout(() => { go(2); showLine(); }, calm ? 0 : 600);
  });

  // ฉาก 2
  let idx = 0;
  const LINE_CATS = [["normal", "orange"], ["love", "gray"], ["happy", "cream"], ["love", "orange"], ["happy", "gray"]];
  $("dots").innerHTML = LINES.map(() => "<i></i>").join("");
  function showLine() {
    const span = document.createElement("span");
    span.textContent = LINES[idx].replaceAll("เธอ", her);
    $("line").replaceChildren(span);
    setCat($("lineCat"), ...LINE_CATS[idx % LINE_CATS.length]);
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === idx));
    $("next").textContent = idx === LINES.length - 1 ? "แล้วก็…" : "ต่อไป";
  }
  $("next").addEventListener("click", () => {
    if (++idx < LINES.length) showLine();
    else go(3);
  });

  // ฉาก 3: ปุ่ม "ไม่" วิ่งหนี ปุ่ม "ไป" โตขึ้นเรื่อย ๆ
  const yes = $("yes"), no = $("no");
  let dodges = 0;
  function dodge(e) {
    e.preventDefault();
    dodges++;
    if (dodges === 1) setCat($("askCat"), "sad");
    no.textContent = NO_TEXTS[Math.min(dodges - 1, NO_TEXTS.length - 1)];
    yes.style.transform = `scale(${Math.min(1 + dodges * 0.12, 1.7)})`;
    $("plea").textContent = dodges < 3 ? "อ้าว ปุ่มมันหนีเองนะ เราไม่ได้ทำ" : "ลองกดปุ่มสีแดงดูสิ ปุ่มนั้นไม่หนี";

    const pad = 14, w = no.offsetWidth, h = no.offsetHeight;
    const maxX = innerWidth - w - pad, maxY = innerHeight - h - pad;
    const yr = yes.getBoundingClientRect();
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(maxX - pad, 0);
      y = pad + Math.random() * Math.max(maxY - pad, 0);
    } while (++tries < 20 &&
      x < yr.right + 20 && x + w > yr.left - 20 && y < yr.bottom + 20 && y + h > yr.top - 20);

    if (!no.classList.contains("running")) {
      const r = no.getBoundingClientRect();
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      no.classList.add("running");
      no.getBoundingClientRect(); // ให้ transition เริ่มจากตำแหน่งเดิม
    }
    no.style.left = x + "px";
    no.style.top = y + "px";
  }
  no.addEventListener("pointerdown", dodge);
  no.addEventListener("click", dodge);
  no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(e); });

  yes.addEventListener("click", () => {
    const r = yes.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 34);
    no.classList.remove("running");
    go(4);
  });

  // ฉาก 4
  const pick = { what: "", when: "" };
  function chips(key, items) {
    const box = $(key);
    items.forEach(text => {
      const c = document.createElement("button");
      c.className = "chip";
      c.textContent = text;
      c.setAttribute("aria-pressed", "false");
      c.addEventListener("click", () => {
        [...box.children].forEach(o => o.setAttribute("aria-pressed", o === c));
        pick[key] = text;
        $("confirm").disabled = !(pick.what && pick.when);
      });
      box.appendChild(c);
    });
  }
  chips("what", ACTIVITIES);
  chips("when", DAYS);

  $("confirm").addEventListener("click", () => {
    $("t-who").textContent = `${her} × ${me}`;
    $("t-what").textContent = pick.what;
    $("t-when").textContent = pick.when;
    go(5);
    burst(innerWidth / 2, innerHeight / 2, 44);
  });

  // ฉาก 5
  $("send").addEventListener("click", async () => {
    const text = `ตกลง ไปเดทกัน ♥\nกิจกรรม: ${pick.what}\nวัน: ${pick.when}`;
    try {
      if (navigator.share) { await navigator.share({ text }); return; }
      await navigator.clipboard.writeText(text);
      $("copied").textContent = "คัดลอกคำตอบแล้ว เอาไปวางในแชทได้เลย";
    } catch (err) {
      if (err.name !== "AbortError") $("copied").textContent = "แคปหน้าจอส่งมาแทนก็ได้นะ";
    }
  });
</script>
</body>
</html>
