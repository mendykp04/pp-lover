<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โหลกำลังใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff6ee;
    --paper-deep: #ffe6d8;
    --ink: #4a2530;
    --ink-soft: #8a5f68;
    --rose: #e0455f;
    --rose-deep: #b92f49;
    --blush: #ffc2cc;
    --card: #ffffff;
    --line: #f3d3cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Sarabun", "Thonburi", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffd9d2 0, transparent 45%),
      radial-gradient(circle at 90% 90%, #ffd0dc 0, transparent 40%),
      var(--paper);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  h1, .note-text, .btn, .count { font-family: "Mali", "Thonburi", cursive; }

  main {
    min-height: 100%;
    display: flex;
    padding: 24px 16px;
  }

  .wrap {
    width: min(100%, 420px);
    margin: auto;
    text-align: center;
  }

  h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); line-height: 1.35; font-weight: 700; }
  p.sub { color: var(--ink-soft); margin-top: 10px; font-size: 1.02rem; line-height: 1.6; }
  .name { color: var(--rose); }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-size: 1.1rem; font-weight: 600;
    padding: 13px 28px; border-radius: 999px;
    background: var(--rose); color: #fff;
    box-shadow: 0 6px 0 var(--rose-deep);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rose-deep); }
  .btn:focus-visible, .jar:focus-visible, .back:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 3px;
  }

  /* โหลแก้ว */
  .jar {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: block; width: 190px; margin: 22px auto 6px;
    animation: bob 2.4s ease-in-out infinite;
  }
  .jar svg { display: block; width: 100%; height: auto; overflow: visible; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .jar.shake { animation: shake .45s ease-in-out; }
  @keyframes shake {
    20% { transform: rotate(-7deg); } 45% { transform: rotate(6deg); }
    70% { transform: rotate(-4deg); } 90% { transform: rotate(2deg); }
  }

  .count { color: var(--ink-soft); font-size: .95rem; min-height: 1.5em; }

  /* กระดาษโน้ต */
  .note {
    display: none;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 26px 22px;
    margin: 18px 0 22px;
    box-shadow: 0 18px 40px -22px rgba(185, 47, 73, .45);
    transform: rotate(var(--tilt, -1.5deg));
  }
  .note.on { display: block; animation: pop .45s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(.7) rotate(0deg); } }
  .note-text {
    font-size: clamp(1.25rem, 5.4vw, 1.5rem);
    line-height: 1.6; font-weight: 600;
  }
  .note-sign { color: var(--rose-deep); margin-top: 10px; font-size: .95rem; }

  .back {
    display: inline-block; margin-top: 22px;
    color: var(--ink-soft); font-size: .95rem;
  }

  .burst {
    position: fixed; z-index: 9; pointer-events: none;
    animation: fly .95s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  @keyframes fly {
    to { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <h1>โหลกำลังใจของ <span class="name" data-her></span></h1>
    <p class="sub">วันไหนเหนื่อย แตะที่โหลแล้วหยิบไปหนึ่งใบนะ</p>

    <button class="jar" id="jar" aria-label="หยิบกำลังใจจากโหล">
      <svg viewBox="0 0 190 220" aria-hidden="true">
        <rect x="52" y="8" width="86" height="26" rx="8" fill="#ffc2cc" stroke="#e0455f" stroke-width="2.5"/>
        <path d="M46 40h98q6 0 6 6v8q22 14 22 44v84q0 26-26 26H44q-26 0-26-26V98q0-30 22-44v-8q0-6 6-6z" fill="#fff" fill-opacity=".7" stroke="#e0455f" stroke-width="2.5" stroke-linejoin="round"/>
        <g id="hearts"></g>
        <path d="M34 102q0-22 14-32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="count" id="count" aria-live="polite"></p>

    <div class="note" id="note" aria-live="polite">
      <p class="note-text" id="noteText"></p>
      <p class="note-sign">♥ เป็นกำลังใจให้เสมอ</p>
    </div>

    <button class="btn" id="pick">หยิบหนึ่งใบ</button>
    <br>
    <a class="back" href="../">← กลับไปอ่านจดหมาย</a>
  </div>
</main>

<script>
  // ====== แก้ตรงนี้ได้เลย ======
  const HER_NAME = "เธอ";      // ชื่อเธอ เช่น "มิ้นท์" (เว้นว่าง = ใช้คำว่า "เธอ")

  const NOTES = [
    "วันนี้เธอทำดีที่สุดแล้วนะคับ",
    "เหนื่อยก็พักก่อนได้ ไม่ต้องรีบนะ",
    "เธอเก่งกว่าที่ตัวเองคิดเยอะเลย",
    "ไม่เป็นไรนะ พรุ่งนี้ค่อยเริ่มใหม่ก็ได้",
    "อย่าลืมกินข้าวให้อิ่ม นอนให้พอนะคับ",
    "แค่เธอผ่านวันนี้มาได้ก็เก่งมากแล้ว",
    "ยิ้มหน่อยนะ เธอยิ้มแล้วน่ารักที่สุดเลย",
    "เรื่องแย่ ๆ วันนี้ เดี๋ยวมันก็ผ่านไป",
    "ดื่มน้ำหน่อยนะคับ แล้วค่อยลุยต่อ",
    "ไม่ต้องเก่งทุกวันก็ได้ เป็นเธอแบบนี้ก็ดีมากแล้ว",
    "มีคนเชียร์เธออยู่ตรงนี้เสมอนะ",
    "หายใจลึก ๆ นะคับ เธอทำได้อยู่แล้ว"
  ];
  // ==============================

  const her = HER_NAME.trim() || "เธอ";
  const $ = id => document.getElementById(id);
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.querySelectorAll("[data-her]").forEach(el => el.textContent = her);
  document.title = "โหลกำลังใจ" + (HER_NAME.trim() ? "ของ " + her : "");

  // หัวใจในโหล
  const heart = (x, y, s, r, c) =>
    `<path transform="translate(${x} ${y}) rotate(${r}) scale(${s})" d="M0 7C-13 -3 -5 -11 0 -3C5 -11 13 -3 0 7Z" fill="${c}"/>`;
  const fills = ["#e0455f", "#ff8fa3", "#ffc2cc", "#ffb347"];
  let jarHearts = "";
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 6; col++) {
      const x = 40 + col * 22 + (row % 2 ? 10 : 0) + Math.random() * 6;
      const y = 196 - row * 21 + Math.random() * 6;
      jarHearts += heart(x.toFixed(1), y.toFixed(1), 1.05, (Math.random() * 60 - 30).toFixed(0), fills[(row + col) % fills.length]);
    }
  }
  $("hearts").innerHTML = jarHearts;

  function burst(x, y, count = 18) {
    if (calm) return;
    const bits = ["♥", "♥", "♥", "✿", "✦"];
    const colors = ["#e0455f", "#ff8fa3", "#ffb347", "#b92f49"];
    for (let i = 0; i < count; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = bits[i % bits.length];
      b.style.left = x + "px";
      b.style.top = y + "px";
      b.style.color = colors[i % colors.length];
      b.style.fontSize = 14 + Math.random() * 18 + "px";
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 150;
      b.style.setProperty("--x", Math.cos(a) * d + "px");
      b.style.setProperty("--y", Math.sin(a) * d - 60 + "px");
      b.style.setProperty("--r", (Math.random() * 360 - 180) + "deg");
      document.body.appendChild(b);
      b.addEventListener("animationend", () => b.remove());
    }
  }

  // หยิบโน้ตแบบไม่ซ้ำจนกว่าจะหมดโหล แล้วค่อยสับใหม่
  let bag = [];
  let picked = 0;
  function pick() {
    if (!bag.length) bag = NOTES.map((_, i) => i).sort(() => Math.random() - .5);
    const text = NOTES[bag.pop()].replaceAll("เธอ", her);

    const jar = $("jar"), note = $("note");
    jar.classList.remove("shake");
    note.classList.remove("on");
    void jar.offsetWidth;   // เริ่มแอนิเมชันใหม่ทุกครั้งที่กด
    jar.classList.add("shake");

    $("noteText").textContent = text;
    note.style.setProperty("--tilt", (Math.random() * 4 - 2).toFixed(1) + "deg");
    note.classList.add("on");

    picked++;
    $("count").textContent = `หยิบไปแล้ว ${picked} ใบ`;
    $("pick").textContent = "หยิบอีกใบ";

    const box = jar.getBoundingClientRect();
    burst(box.left + box.width / 2, box.top + 20);
  }
  $("jar").addEventListener("click", pick);
  $("pick").addEventListener("click", pick);
</script>
</body>
</html>
